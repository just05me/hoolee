# Всё hoolee — один compose, отдельные сервисы. Наружу открыты только 127.0.0.1-порты,
# дальше их проксирует Caddy на хосте (см. deploy/Caddyfile.snippet).
name: hoolee

services:
  site:            # сайт-портфолио (статика), отделён от остальных сервисов
    build:
      context: .
      dockerfile: docker/site.Dockerfile
      args: { DEMO_URL: "https://demo.hoolee.uz" }
    restart: unless-stopped
    ports: ["127.0.0.1:4321:80"]
    networks: [web]

  api:             # приём заявок + отправка в Telegram-бота
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args: { SERVICE: api }
    restart: unless-stopped
    env_file: .env
    environment: { PORT: "8788" }
    ports: ["127.0.0.1:8788:8788"]
    networks: [web]

  demo-ark:        # демо Ark Core, без внешних API
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args: { SERVICE: demo-ark }
    restart: unless-stopped
    environment: { PORT: "8787" }
    ports: ["127.0.0.1:8787:8787"]
    networks: [web]

  # anton:         # добавим, когда решим, как показывать Anton (сейчас только страница-кейс)

networks:
  web: {}
